plugins { id 'com.android.application' version '8.10.1' }

// Include the same license distributed with the corresponding source in each APK.
tasks.withType(Sync).configureEach {
    if (name ==~ /process.+JavaRes/) {
        from('LICENSE') { into 'META-INF/dev.oos.nativepanels' }
    }
}

apply from: 'gradle/system-ui-revision.gradle'
tasks.matching { it.name ==~ /process.+Resources/ }.configureEach {
    inputs.file('gradle/system-ui-ids.txt')
}

android {
    namespace 'dev.oos.nativepanels'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.oos.nativepanels'
        minSdk 30
        targetSdk 35
        versionCode 90
        versionName '0.6.78'
        buildConfigField 'String', 'SYSTEM_UI_REVISION', '"' + systemUiRevision + '"'
    }
    androidResources { additionalParameters += ['--stable-ids', file('gradle/system-ui-ids.txt').absolutePath] }
    buildFeatures { buildConfig true }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            resources.srcDirs = ['resources']
        }
        test { java.srcDirs = ['tests'] }
    }
    signingConfigs {
        testRelease {
            storeFile file('test-signing.p12')
            storePassword (System.getenv('OOS_STORE_PASSWORD') ?: '')
            keyAlias 'test'
            keyPassword (System.getenv('OOS_KEY_PASSWORD') ?: '')
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.testRelease; minifyEnabled false }
        debug {
            if (file('test-signing.p12').isFile() && System.getenv('OOS_STORE_PASSWORD') && System.getenv('OOS_KEY_PASSWORD')) {
                signingConfig signingConfigs.testRelease
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            def proxy = System.getenv('OOS_MAVEN_PROXY')
            systemProperty 'robolectric.dependency.repo.url', proxy ? "${proxy}/maven" : 'https://maven-central.storage-download.googleapis.com/maven2'
            testLogging.exceptionFormat = 'full'
            systemProperty 'robolectric.graphicsMode', 'NATIVE'
        }
    }
    packaging { resources.excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    // Scope requests use the stable service 101 protocol, also supported by API 102 frameworks.
    implementation 'io.github.libxposed:service:101.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'io.github.libxposed:api:102.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
}
