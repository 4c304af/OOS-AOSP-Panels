name: Build and release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.verify.outputs.version }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Run unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build signed release APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          OOS_KEYSTORE_BASE64: ${{ secrets.OOS_KEYSTORE_BASE64 }}
          OOS_STORE_PASSWORD: ${{ secrets.OOS_STORE_PASSWORD }}
          OOS_KEY_PASSWORD: ${{ secrets.OOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${OOS_KEYSTORE_BASE64:?Missing keystore}" "${OOS_STORE_PASSWORD:?Missing store password}" "${OOS_KEY_PASSWORD:?Missing key password}"
          umask 077
          trap 'rm -f -- test-signing.p12' EXIT
          printf '%s' "$OOS_KEYSTORE_BASE64" | base64 --decode > test-signing.p12
          unset OOS_KEYSTORE_BASE64
          ./gradlew --no-daemon assembleRelease

      - name: Verify signing certificate and prepare APK
        id: verify
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          dir=build/outputs/apk/release
          entry=$(jq -ce '.elements | select(length == 1) | first' "$dir/output-metadata.json")
          version=$(jq -er '.versionName' <<< "$entry")
          apk="$dir/$(jq -er '.outputFile' <<< "$entry")"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          digest=$("$signer" verify --print-certs "$apk" | awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ {print $NF}')
          expected=83cf016702121d7bf2adbc358418563e074510b5e44d8ae004dc47110a2cd818
          if [[ "$digest" != "$expected" ]]; then
            echo "::error::APK signer does not match the original certificate"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/OOS-AOSP-Panels-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OOS-AOSP-Panels-release-${{ github.run_attempt }}
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      BUILD_ATTEMPT: ${{ needs.build.outputs.attempt }}
    steps:
      - name: Check whether this APK version is already published
        id: check
        run: |
          set -euo pipefail
          # Earlier releases used v<version>-build.<run>.<attempt>.
          versions=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name | (., sub("-build\\.[0-9]+\\.[0-9]+$"; ""))')
          if grep -Fxq -- "v$VERSION" <<< "$versions"; then
            echo "Version $VERSION already has a release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish signed APK to GitHub Releases
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "OOS-AOSP-Panels-release-$BUILD_ATTEMPT" --dir dist
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          # Optional user-facing notes live in the release commit, never in README.
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            --jq '.commit.message | split("\n\nRelease notes:\n") | if length > 1 then .[1:] | join("\n\nRelease notes:\n") else "" end' > "$notes_file"
          printf '\nBuilt from %s. [GitHub Actions run](%s/%s/actions/runs/%s).\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$notes_file"
          gh release create "v$VERSION" "dist/OOS-AOSP-Panels-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OOS AOSP Panels $VERSION" "${flags[@]}" \
            --notes-file "$notes_file"
